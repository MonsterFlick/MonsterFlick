# Draws the contribution grid as a terracotta snake "reading" the year,
# using the same paper & terracotta palette as omthakur.in.
# Output is published to the `output` branch and referenced from README.md.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: MonsterFlick
          outputs: |
            dist/github-snake.svg?color_snake=#9E3D2B&color_dots=#EDE4D9,#E2D5C6,#D9A593,#C4604A,#9E3D2B
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
