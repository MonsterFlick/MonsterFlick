<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="252" viewBox="0 0 1200 252">
  <title>Colophon — signed, Om Thakur</title>
  <defs>
    <style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-rendering: geometricPrecision; -webkit-font-smoothing: antialiased; }
.serif { font-family: "Playfair Display", "Georgia", "Iowan Old Style", "Apple Garamond", "Times New Roman", serif; }
.mono { font-family: "Geist Mono", "JetBrains Mono", "SF Mono", Menlo, Consolas, "Courier New", monospace; }
.sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

.draw { animation: draw 1.6s cubic-bezier(.22, 1, .36, 1) forwards; }
.fade { animation: fade 1.1s cubic-bezier(.22, 1, .36, 1) both; }
.rise { animation: rise 1.1s cubic-bezier(.22, 1, .36, 1) both; }

@keyframes draw { from { stroke-dashoffset: var(--len, 600); } to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.sig{stroke-dasharray:1400;animation:sig 3.2s cubic-bezier(.65,0,.35,1) .3s both,sigfill 1s ease 2.7s both}
@keyframes sig{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@keyframes sigfill{from{fill-opacity:0}to{fill-opacity:1}}
</style>
  </defs>
  <rect x="1" y="1" width="1198" height="250" rx="12" fill="#FAF6F1" stroke="#E2D5C6" stroke-width="1.5"/><rect x="9" y="9" width="1182" height="234" rx="8" fill="none" stroke="#D4C3AF" stroke-opacity=".55" stroke-dasharray="1 5" stroke-linecap="round"/><line x1="450" y1="48" x2="584" y2="48" stroke="#D4C3AF" stroke-width="1.2" stroke-linecap="round" class="draw" stroke-dasharray="134.0" style="--len:134.0;animation-delay: 0.10s;"/><rect x="596.5" y="44.5" width="7" height="7" fill="#9E3D2B" transform="rotate(45 600 48)"/><line x1="616" y1="48" x2="750" y2="48" stroke="#D4C3AF" stroke-width="1.2" stroke-linecap="round" class="draw" stroke-dasharray="134.0" style="--len:134.0;animation-delay: 0.10s;"/><text x="600" y="86" class="mono fade" style="font-size:11px;font-weight:700;fill:#9E3D2B;letter-spacing:4px;text-anchor:middle">COLOPHON</text><text x="600" y="158" class="serif sig" font-size="58" font-weight="700" font-style="italic" text-anchor="middle" fill="#9E3D2B" stroke="#9E3D2B" stroke-width="1.1">Om Thakur</text><text x="600" y="198" class="mono fade" style="font-size:11px;font-weight:600;fill:#5A524A;letter-spacing:1.2px;text-anchor:middle;animation-delay: 1.20s;">Set in Playfair Display &amp; Geist Mono  ·  Composed in Mumbai  ·  Edition MMXXVI</text><text x="600" y="224" class="serif fade" style="font-size:15px;font-weight:400;fill:#2C2825;text-anchor:middle;font-style:italic;animation-delay: 1.40s;">Thank you for reading this volume.</text>
</svg>