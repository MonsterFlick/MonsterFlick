<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title"><title id="title">Career chronology — Krishora Technologies, CIARL, Sumeru Technology Solutions, University of Mumbai</title><style>
