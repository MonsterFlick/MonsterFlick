" font-size="24" fill="#1A1816" font-weight="800" text-anchor="start">Sumeru Technology Solutions</text><text x="96" y="348" class="serif" font-size="16.5" fill="#4A4541" font-weight="400" text-anchor="start" font-style="italic">Software Development Engineer Intern</text><text x="96" y="372" class="sans" font-size="14" fill="#2C2825"><tspan fill="#9E3D2B" font-weight="700">→ </tspan>Flexbase message queues (15 min → 4 s sync) · production database crash RCA · PHP → TypeScript/Deno Edge migration</text></g><line x1="96" y1="386" x2="1164" y2="386" stroke="#EDE4D9" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><g class="fade" style="animation-delay:0.9000000000000001s"><circle cx="64" cy="400" r="7" fill="#FDFCFA" stroke="#9E3D2B" stroke-width="2.5"/><circle cx="64" cy="400" r="2.6" fill="#9E3D2B"/></g><g class="rise" style="animation-delay:0.9000000000000001s"><text x="96" y="405" class="mono" font-size="11.5" fill="#9E3D2B" font-weight="700" text-anchor="start" letter-spacing="2">JUN 2024 — AUG 2024</text><rect x="1078" y="387" width="86" height="24" rx="12" fill="#4A4541" fill-opacity=".1"/><text x="1121" y="403" class="mono" font-size="10.5" fill="#4A4541" font-weight="700" text-anchor="middle" letter-spacing="1.4">3 MONTHS</text><text x="96" y="438" class="serif" font-size="24" fill="#1A1816" font-weight="800" text-anchor="start">Bhimrao Pradhan College, University of Mumbai</text><text x="96" y="462" class="serif" font-size="16.5" fill="#4A4541" font-weight="400" text-anchor="start" font-style="italic">Assistant Professor (Volunteer)</text><text x="96" y="486" class="sans" font-size="14" fill="#2C2825"><tspan fill="#9E3D2B" font-weight="700">→ </tspan>Taught B.Sc. IT database systems and software architecture</text></g></svg>
