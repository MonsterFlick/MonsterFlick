<svg xmlns="http://www.w3.org/2000/svg" width="580" height="272" viewBox="0 0 580 272" role="img" aria-labelledby="title"><title id="title">devpic — Open-source, stateless REST API that generates deterministic mathematical SVG meshes on the Next.js Edge Runtime — zero database, zero dependencies, sub-10 ms responses.</title><style>
.serif{font-family:'Playfair Display', Georgia, 'Times New Roman', serif}
.mono{font-family:'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
.sans{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
.rise{animation:rise .9s cubic-bezier(.22,1,.36,1) both}
.fade{animation:fade 1.1s ease both}
.draw{animation:draw 1.6s cubic-bezier(.65,0,.35,1) both}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x="1" y="1" width="578" height="270" rx="12" fill="#FDFCFA" stroke="#EDE4D9" stroke-width="1.5"/><line x1="28" y1="2" x2="132" y2="2" stroke="#9E3D2B" stroke-width="3" stroke-linecap="round" class="draw" stroke-dasharray="104" style="--len:104;animation-delay:0.1s"/><g class="rise"><text x="28" y="44" class="mono" font-size="11" fill="#9E3D2B" font-weight="700" text-anchor="start" letter-spacing="2.2">CH. 04  ·  LOW-LEVEL TOOLS</text><rect x="442" y="26" width="110" height="26" rx="13" fill="#9E3D2B" fill-opacity=".1"/><text x="497" y="43" class="mono" font-size="11" fill="#9E3D2B" font-weight="700" text-anchor="middle" letter-spacing="0.6">&lt; 10 MS TTFB</text><text x="28" y="88" class="serif" font-size="27" fill="#1A1816" font-weight="800" text-anchor="start" letter-spacing="-0.3">devpic</text><text x="28" y="118" class="sans" font-size="14.5" fill="#2C2825" font-weight="400" text-anchor="start">Open-source, stateless REST API that generates deterministic</text><text x="28" y="140" class="sans" font-size="14.5" fill="#2C2825" font-weight="400" text-anchor="start">mathematical SVG meshes on the Next.js Edge Runtime — zero</text><text x="28" y="162" class="sans" font-size="14.5" fill="#2C2825" font-weight="400" text-anchor="start">database, zero dependencies, sub-10 ms responses.</text></g><g class="fade" style="animation-delay:0.5s"><rect x="28" y="186" width="88" height="26" rx="5" fill="#F3ECE4" stroke="#D4C3AF"/><text x="38" y="203" class="mono" font-size="11" fill="#1A1816" font-weight="600" text-anchor="start" letter-spacing="0.2">TypeScript</text></g><g class="fade" style="animation-delay:0.6s"><rect x="124" y="186" width="102" height="26" rx="5" fill="#F3ECE4" stroke="#D4C3AF"/><text x="134" y="203" class="mono" font-size="11" fill="#1A1816" font-weight="600" text-anchor="start" letter-spacing="0.2">Edge Runtime</text></g><g class="fade" style="animation-delay:0.7s"><rect x="233.6" y="186" width="74" height="26" rx="5" fill="#F3ECE4" stroke="#D4C3AF"/><text x="243.6" y="203" class="mono" font-size="11" fill="#1A1816" font-weight="600" text-anchor="start" letter-spacing="0.2">REST API</text></g><g class="fade" style="animation-delay:0.8s"><rect x="316" y="186" width="40" height="26" rx="5" fill="#F3ECE4" stroke="#D4C3AF"/><text x="326" y="203" class="mono" font-size="11" fill="#1A1816" font-weight="600" text-anchor="start" letter-spacing="0.2">SVG</text></g><line x1="28" y1="230" x2="552" y2="230" stroke="#EDE4D9" stroke-width="1" stroke-linecap="round" class="draw" stroke-dasharray="524" style="--len:524;animation-delay:0.3s"/><g class="fade" style="animation-delay:0.6s"><circle cx="34" cy="251" r="3.5" fill="#566449"/><circle cx="34" cy="251" r="3.5" fill="none" stroke="#566449" stroke-width="1.5"><animate attributeName="r" values="3.5;11.2" dur="2.2s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle><text x="46" y="255" class="mono" font-size="10.5" fill="#566449" font-weight="700" text-anchor="start" letter-spacing="1.6">OPEN SOURCE</text><text x="552" y="255" class="mono" font-size="11" fill="#4A4541" font-weight="600" text-anchor="end">↗ github.com/MonsterFlick/devpic</text></g></svg>
