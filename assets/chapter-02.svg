<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="108" viewBox="0 0 1200 108">
  <title>Chapter 02 — Production Benchmarks</title>
  <defs>
    <style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-rendering: geometricPrecision; -webkit-font-smoothing: antialiased; }
.serif { font-family: "Playfair Display", "Georgia", "Iowan Old Style", "Apple Garamond", "Times New Roman", serif; }
.mono { font-family: "Geist Mono", "JetBrains Mono", "SF Mono", Menlo, Consolas, "Courier New", monospace; }
.sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

.draw { animation: draw 1.6s cubic-bezier(.22, 1, .36, 1) forwards; }
.fade { animation: fade 1.1s cubic-bezier(.22, 1, .36, 1) both; }
.rise { animation: rise 1.1s cubic-bezier(.22, 1, .36, 1) both; }
.pulse { animation: pulse 2.6s ease-in-out infinite; }

@keyframes draw { from { stroke-dashoffset: var(--len, 600); } to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(.93); } }
</style>
  </defs>
  <rect x="1" y="1" width="1198" height="106" rx="12" fill="#FAF6F1" stroke="#E2D5C6" stroke-width="1.5"/><rect x="9" y="9" width="1182" height="90" rx="8" fill="none" stroke="#D4C3AF" stroke-opacity=".55" stroke-dasharray="1 5" stroke-linecap="round"/><text x="36" y="42" class="mono rise" style="font-size:12px;font-weight:700;fill:#9E3D2B;letter-spacing:3px">CHAPTER 02</text><rect x="145" y="35" width="6" height="6" fill="#9E3D2B" transform="rotate(45 148 38)" class="pulse"/><text x="1164" y="42" class="mono fade" style="font-size:11px;font-weight:600;fill:#5A524A;letter-spacing:2.4px;text-anchor:end;animation-delay: 0.30s;">PAGE 07</text><text x="34" y="82" class="serif rise" style="font-size:34px;font-weight:800;fill:#1A1816;letter-spacing:-0.4px;animation-delay: 0.12s;">Production Benchmarks</text><text x="1164" y="82" class="serif fade" style="font-size:18px;font-weight:400;fill:#5A524A;text-anchor:end;font-style:italic;animation-delay: 0.45s;">Measured in production, not in slides</text><line x1="36" y1="95" x2="1164" y2="95" stroke="#E2D5C6" stroke-width="1" stroke-linecap="round" class="draw" stroke-dasharray="1128.0" style="--len:1128.0;animation-delay: 0.15s;"/><line x1="36" y1="95" x2="128" y2="95" stroke="#9E3D2B" stroke-width="2.5" stroke-linecap="round" class="draw" stroke-dasharray="92.0" style="--len:92.0;animation-delay: 0.35s;"/>
</svg>