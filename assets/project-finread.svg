<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="580" height="272" viewBox="0 0 580 272">
  <title>Fin Read — Android finance tracker in Kotlin that extracts SMS transactions into a Room database and syncs idempotently to Supabase — fully usable without a network.</title>
  <defs>
    <style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-rendering: geometricPrecision; -webkit-font-smoothing: antialiased; }
.serif { font-family: "Playfair Display", "Georgia", "Iowan Old Style", "Apple Garamond", "Times New Roman", serif; }
.mono { font-family: "Geist Mono", "JetBrains Mono", "SF Mono", Menlo, Consolas, "Courier New", monospace; }
.sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

.draw { animation: draw 1.6s cubic-bezier(.22, 1, .36, 1) forwards; }
.fade { animation: fade 1.1s cubic-bezier(.22, 1, .36, 1) both; }
.rise { animation: rise 1.1s cubic-bezier(.22, 1, .36, 1) both; }

@keyframes draw { from { stroke-dashoffset: var(--len, 600); } to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
  </defs>
  <rect x="1" y="1" width="578" height="270" rx="12" fill="#FDFCFA" stroke="#E2D5C6" stroke-width="1.5"/><line x1="28" y1="2" x2="132" y2="2" stroke="#9E3D2B" stroke-width="3" stroke-linecap="round" class="draw" stroke-dasharray="104.0" style="--len:104.0;animation-delay: 0.10s;"/><g class="rise"><text x="28" y="44" class="mono" style="font-size:11px;font-weight:700;fill:#9E3D2B;letter-spacing:2.2px">CH. 05  ·  MOBILE SYSTEMS</text><rect x="434" y="26" width="118" height="26" rx="13" fill="#9E3D2B" fill-opacity=".1"/><text x="493" y="43" class="mono" style="font-size:11px;font-weight:700;fill:#9E3D2B;letter-spacing:0.6px;text-anchor:middle">OFFLINE-FIRST</text><text x="28" y="88" class="serif" style="font-size:27px;font-weight:800;fill:#1A1816;letter-spacing:-0.3px">Fin Read</text><text x="28" y="118" style="font-size:14.5px;font-weight:400;fill:#2C2825">Android finance tracker in Kotlin that extracts SMS transactions</text><text x="28" y="140" style="font-size:14.5px;font-weight:400;fill:#2C2825">into a Room database and syncs idempotently to Supabase — fully</text><text x="28" y="162" style="font-size:14.5px;font-weight:400;fill:#2C2825">usable without a network.</text></g><g class="fade" style="animation-delay: 0.50s;"><rect x="28" y="186" width="61" height="26" rx="5" fill="#F4EDE2" stroke="#D4C3AF"/><text x="38" y="203" class="mono" style="font-size:11px;font-weight:600;fill:#1A1816;letter-spacing:0.2px">Kotlin</text></g><g class="fade" style="animation-delay: 0.60s;"><rect x="96.8" y="186" width="68" height="26" rx="5" fill="#F4EDE2" stroke="#D4C3AF"/><text x="106.8" y="203" class="mono" style="font-size:11px;font-weight:600;fill:#1A1816;letter-spacing:0.2px">Room DB</text></g><g class="fade" style="animation-delay: 0.70s;"><rect x="172.39999999999998" y="186" width="74" height="26" rx="5" fill="#F4EDE2" stroke="#D4C3AF"/><text x="182.39999999999998" y="203" class="mono" style="font-size:11px;font-weight:600;fill:#1A1816;letter-spacing:0.2px">Supabase</text></g><g class="fade" style="animation-delay: 0.80s;"><rect x="254.79999999999998" y="186" width="88" height="26" rx="5" fill="#F4EDE2" stroke="#D4C3AF"/><text x="264.79999999999995" y="203" class="mono" style="font-size:11px;font-weight:600;fill:#1A1816;letter-spacing:0.2px">Material 3</text></g><line x1="28" y1="230" x2="552" y2="230" stroke="#E2D5C6" stroke-width="1" stroke-linecap="round" class="draw" stroke-dasharray="524.0" style="--len:524.0;animation-delay: 0.30s;"/><g class="fade" style="animation-delay: 0.60s;"><circle cx="34" cy="251" r="3.5" fill="#566449"/><circle cx="34" cy="251" r="3.5" fill="none" stroke="#566449" stroke-width="1.8"><animate attributeName="r" values="3.5;11.2" dur="2.2s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".75;0" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle><text x="46" y="255" class="mono" style="font-size:10.5px;font-weight:700;fill:#566449;letter-spacing:1.6px">OPEN SOURCE</text><text x="552" y="255" class="mono" style="font-size:11px;font-weight:600;fill:#5A524A;text-anchor:end">↗ github.com/MonsterFlick/Fin-Read</text></g>
</svg>