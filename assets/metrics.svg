<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="482" viewBox="0 0 1200 482" role="img" aria-labelledby="title"><title id="title">Production benchmarks — 15 min to 4 s, ~700 ms, under 10 ms, under 30 ms, First Rank</title><style>
.serif{font-family:'Playfair Display', Georgia, 'Times New Roman', serif}
