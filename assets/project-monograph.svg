<svg xmlns="http://www.w3.org/2000/svg" width="580" height="272" viewBox="0 0 580 272" role="img" aria-labelledby="title"><title id="title">Read the full interactive monograph at omthakur.in</title><style>
.serif{font-family:'Playfair Display', Georgia, 'Times New Roman', serif}
