e:48px;font-weight:900;fill:#9E3D2B">51+</text><text x="176" y="154" class="serif" style="font-size:21px;font-weight:800;fill:#1A1816">Public Repositories</text><text x="176" y="176" class="sans" style="font-size:13.5px;font-weight:400;fill:#2C2825">Distributed systems, edge APIs, mobile engines &amp; AI automation</text></g><g class="rise" style="animation-delay: 0.40s;"><text x="56" y="242" class="serif" style="font-size:40px;font-weight:900;fill:#1A1816">5+ Yrs</text><text x="194" y="226" class="serif" style="font-size:21px;font-weight:800;fill:#1A1816">Continuous Engineering</text><text x="194" y="248" class="sans" style="font-size:13.5px;font-weight:400;fill:#2C2825">Active commit chronology and deployments since April 2021</text></g><line x1="56" y1="276" x2="548" y2="276" stroke="#D4C3AF" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><g class="fade" style="animation-delay: 0.60s;"><circle cx="68" cy="308" r="4" fill="#566449"/><circle cx="68" cy="308" r="4" fill="none" stroke="#566449" stroke-width="1.8"><animate attributeName="r" values="4;12.8" dur="2.2s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".75;0" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle><text x="86" y="312" class="mono" style="font-size:10.5px;font-weight:700;fill:#566449;letter-spacing:1.2px">ZERO DATABASE CRASH PHILOSOPHY · STATELESS EDGE APIS</text></g><rect x="592" y="74" width="572" height="276" rx="8" fill="#FDFCFA" stroke="#E2D5C6" stroke-width="1.2"/><line x1="592" y1="74" x2="706" y2="74" stroke="#9E3D2B" stroke-width="3" stroke-linecap="round"/><text x="612" y="106" class="mono" style="font-size:11.5px;font-weight:700;fill:#9E3D2B;letter-spacing:2px">LANGUAGE SPECIMEN DISTRIBUTION</text><text x="1144" y="106" class="mono" style="font-size:11px;font-weight:600;fill:#5A524A;letter-spacing:1px;text-anchor:end">BY REPOSITORY VOLUME</text><line x1="612" y1="120" x2="1144" y2="120" stroke="#D4C3AF" stroke-width="1" stroke-linec